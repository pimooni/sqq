[build-system]
requires = [
  "scikit-build-core >= 0.10",
  "pybind11 >= 2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "sqq"
dynamic = ["version"]
description = "Shell Quant Qualifier for water-shell topology analysis in MD trajectories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "J. PANG" },
  { name = "Q. SUN" },
  { email = "pimooni@gmail.com" },
]
dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  "pyyaml",
  "MDAnalysis",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]

[project.optional-dependencies]
dev = ["pytest", "networkx", "ruff", "mypy"]

[project.scripts]
sqq = "sqq.cli:main"

[project.urls]
Homepage = "https://github.com/pimooni/sqq"
Repository = "https://github.com/pimooni/sqq"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
cmake.source-dir = "sqq/core/sqq_cpp/native"
cmake.build-type = "Release"
wheel.packages = ["sqq"]
wheel.exclude = ["sqq/core/sqq_cpp/native/**"]
sdist.include = [
  "sqq/core/sqq_cpp/native/CMakeLists.txt",
  "sqq/core/sqq_cpp/native/include/**",
  "sqq/core/sqq_cpp/native/src/**",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "sqq/_version.py"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
