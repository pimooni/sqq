name: Build check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Linux wheel and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_ARCHS: x86_64
          CIBW_TEST_COMMAND: >-
            python -c "from importlib.metadata import version; import os; import subprocess; import sqq; import sqq.cli;
            from sqq.core.sqq_cpp import _sqq_cpp as native;
            assert version('sqq') == sqq.__version__ == native.core_version();
            cli_env = dict(os.environ, PYTHONIOENCODING='utf-8', PYTHONUTF8='1');
            cli_version = subprocess.run(['sqq', '--version'], check=True, capture_output=True, encoding='utf-8', env=cli_env);
            assert cli_version.stdout.strip() == sqq.cli.VERSION_LINE;
            cli_help = subprocess.run(['sqq', '-h'], check=True, capture_output=True, encoding='utf-8', env=cli_env);
            assert 'usage: sqq' in cli_help.stdout;
            assert all(command in cli_help.stdout for command in ('init', 'analyze', 'track', 'vmd'))"
        with:
          package-dir: .
          output-dir: wheelhouse
